name: Deploy OPS dashboard
on:
  workflow_dispatch:
  repository_dispatch:
    types: [ops-kpi-refresh]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate aggregate refresh payload
        if: github.event_name == 'repository_dispatch'
        env:
          OPS_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/prepare-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
